projectPrefix: AiPlatform
toolPrefix: AiPlatform
groupId: com.jakt
projectArtifactPrefix: aiplatform

# ---------------- 数据库（配置了 tables 时必填） ----------------
jdbc:
  url: jdbc:mysql://192.168.3.131:30306/aiplatform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  username: root
  password: "123456"

# 生成输出根目录（项目骨架 init 与表级 CRUD 的落点）
outputDir: /Users/jakt/IdeaProjects/aiplatform

tables:
  - db_table_name: auth_user
    model_name: AuthUser
    model_comment: 用户表
    generateController: false
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2

  - db_table_name: auth_role
    model_name: AuthRole
    model_comment: 角色表
    generateController: false
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2

  - db_table_name: auth_menu
    model_name: AuthMenu
    model_comment: 菜单权限表
    generateController: false
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2

  - db_table_name: auth_login_log
    model_name: AuthLoginLog
    model_comment: 登录记录表
    generateController: false

  - db_table_name: cluster_pod_config
    model_name: ClusterPodConfig
    model_comment: "业务pod配置表"
    generateController: true
    columns:
      resource_name:
        comment: "资源名称"
        type: String
      pod_name:
        comment: "pod名称"
        type: String
      git_url:
        type: String
      auto_refresh:
        type: Integer
        comment: "自动刷新开关"
      status:
        type: enum
        enum:
          className: ClusterPodConfigStatusEnum
          values:
            - { code: DRAFT, name: DRAFT, desc: "草稿" }
            - { code: BUILDING, name: BUILDING, desc: "构建中" }
            - { code: BUILD_FAILED, name: BUILD_FAILED, desc: "构建失败" }
            - { code: PUBLISHED, name: PUBLISHED, desc: "发布" }
            - { code: RETIRED, name: RETIRED, desc: "弃用" }
        comment: "配置状态"

  - db_table_name: file_info
    model_name: FileInfo
    model_comment: "文件信息表"
    generateController: true

  - db_table_name: home_purchase_item
    model_name: HomePurchaseItem
    model_comment: "家庭装修采购项"
    generateController: true
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2
    columns:
      budget_text:
        comment: "预算原文（800~1200 或 999）"
      budget_min:
        comment: "预算下限（单件）"
      budget_max:
        comment: "预算上限（单件）"
      install_fee:
        comment: "安装费（单件）"
      big_type_name:
        comment: "大类名称（如 硬装）"
      type_name:
        comment: "小类名称（如 空调）"

  # 采购项图片：内部表，不生成 Controller/Manager，由采购项服务在事务里编排
  - db_table_name: home_purchase_item_image
    model_name: HomePurchaseItemImage
    model_comment: "家庭装修采购项图片"
    generateController: false
