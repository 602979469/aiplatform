projectPrefix: AiPlatform
toolPrefix: AiPlatform
groupId: com.jakt
projectArtifactPrefix: aiplatform

# ---------------- 数据库（配置了 tables 时必填） ----------------
jdbc:
  url: jdbc:mysql://localhost:3306/aiplatform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  username: root
  password: "123456"

# 生成输出根目录（项目骨架 init 与表级 CRUD 的落点）
outputDir: /Users/jakt/IdeaProjects/aiplatform

tables:
  - db_table_name: ai_chat_session
    model_name: AiChatSession
    model_comment: 用户AI会话
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2

  - db_table_name: ai_chat_message
    model_name: AiChatMessage
    model_comment: 用户AI会话消息
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2

  - db_table_name: sys_ai_capability
    model_name: AiCapability
    model_comment: AI能力

  - db_table_name: sys_ai_session
    model_name: AiSystemSession
    model_comment: 系统AI会话
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2

  - db_table_name: sys_ai_message
    model_name: AiSystemMessage
    model_comment: 系统AI会话消息
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2
