apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiplatform
  namespace: tsk
  labels:
    app: aiplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiplatform
  template:
    metadata:
      labels:
        app: aiplatform
    spec:
      affinity:                                        # ← 改动1：新增节点亲和性（钉 master）
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-master
      # 集群管理权限：绑定到 ClusterRoleBinding aiplatform-cluster-admin（见 aiplatform-cluster-rbac.yaml）
      serviceAccountName: default
      containers:
        - name: aiplatform
          # 流水线会替换为 aiplatform:<commit 短哈希>
          image: aiplatform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MYSQL_HOST
              value: mysql.tsk.svc.cluster.local
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: REDIS_HOST
              value: redis.tsk.svc.cluster.local        # ← 改动2：ruoyi-redis → redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
            - name: AIPLATFORM_AVATAR_DIR
              value: /data/uploads
            # 集群部署编排 SSH：pod 内挂载的 master 私钥（secret: aiplatform-ssh-key）
            - name: SSH_USERNAME
              value: ubuntu
            - name: SSH_PRIVATE_KEY_PATH
              value: /root/.ssh/id_rsa
            - name: CLUSTER_CI_WORK_DIR
              value: /home/ubuntu/cluster-ci
            - name: CLUSTER_CI_MASTER_HOST
              value: 192.168.3.131
            - name: CLUSTER_CI_WORKER_HOST
              value: 192.168.3.217
            - name: LOG_FILE_PATH
              value: /app/logs/
            # DeepSeek API Key 从 secret aiplatform-secret 注入（对应 application.yml 的 ${DEEPSEEK_API_KEY:}）
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiplatform-secret
                  key: DEEPSEEK_API_KEY
                  optional: true
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            - name: ssh-key
              mountPath: /root/.ssh
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: uploads
          hostPath:
            path: /data/aiplatform-uploads
            type: DirectoryOrCreate
        - name: ssh-key
          secret:
            secretName: aiplatform-ssh-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: aiplatform
  namespace: tsk
  labels:
    app: aiplatform
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
      name: http
  selector:
    app: aiplatform
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiplatform
  namespace: tsk
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: www.jakt.online
      http:
        paths:
          - path: /prod-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aiplatform
                port:
                  number: 8080
