server:
  port: 8080

spring:
  application:
    name: aiplatform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/aiplatform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 10s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      # 文件管理模块：上传不设业务上限（实际受磁盘空间与部署网关约束）
      max-file-size: -1
      max-request-size: -1

# Sa-Token 认证授权配置
sa-token:
  token-name: satoken
  timeout: 86400            # token 有效期（秒）
  active-timeout: -1        # 无操作过期（-1 不启用）
  is-concurrent: false      # 同账号是否允许并发登录
  is-share: false           # 同账号并发登录时是否共享 token
  token-style: uuid
  is-log: false

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

# AI 模块外部服务配置
ai:
  deepseek:
    # 可选能力：未配置时为空（唯一保留的空默认，生产 K8s optional secret 注入）
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 1.0
    max-tokens: 4096
    connect-timeout: 30
    read-timeout: 180
  # Dify 工作流（AI 能力的另一个提供方，见 sys_ai_capability.provider）
  dify:
    # Service API 地址（注意带 /v1）
    base-url: ${DIFY_BASE_URL:https://dify.jakt.online/v1}
    # 默认 API Key（app-xxx）；能力可用 provider_config.apiKey 单独覆盖
    api-key: ${DIFY_API_KEY:}
    connect-timeout: 10
    # 工作流可能多步调用模型，读超时给宽一点
    read-timeout: 180
  xuanyuan:
    registry-url: https://docker.xuanyuan.run
    web-url: https://xuanyuan.cloud
  mirror:
    # 镜像加速器远程 docker 主机（执行 docker pull/save），生产 K8s 注入 AIPLATFORM_MIRROR_SSH_HOST
    ssh-host: ${AIPLATFORM_MIRROR_SSH_HOST}
  minio:
    # MinIO 对象存储（文件/镜像统一存这里，DB 只存元数据），生产 K8s Secret minio-credentials 注入
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
  ssh:
    # master 主机 SSH（构建/部署脚本执行机），生产 K8s 注入 SSH_USERNAME/SSH_PRIVATE_KEY_PATH
    username: ${SSH_USERNAME}
    private-key-path: ${SSH_PRIVATE_KEY_PATH}
    timeout-seconds: 900

# 日志目录（生产 K8s 注入 LOG_FILE_PATH；本地默认见 application-dev.yml）
log:
  file:
    path: ${LOG_FILE_PATH}

# 集群管理（cluster-ci）
cluster:
  ci:
    # master 上的工作根目录（挂载/脚本目录），生产 K8s 注入
    work-dir: ${CLUSTER_CI_WORK_DIR}
    master-host: ${CLUSTER_CI_MASTER_HOST}
    worker-host: ${CLUSTER_CI_WORKER_HOST}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{40} - %msg%n"
  level:
    com.jakt.aiplatform: info

# Elasticsearch（题库检索）
es:
  url: ${ES_URL:http://elasticsearch.efk.svc.cluster.local:9200}
  username: ${ES_USERNAME:elastic}
  password: ${ES_PASSWORD:}
  question-index: ${ES_QUESTION_INDEX:java-kb}

# 家庭装修采购（家具采购清单 / 预算报告）
aiplatform:
  home:
    # 家具类型树（大类 → 小类）。整体覆盖用环境变量 AIPLATFORM_HOME_FURNITURE_TYPES（同样格式的 JSON 字符串）。
    # icon 是给前端的简易素材标识（emoji 或图标名），前端直接渲染。
    # 报价粒度：hardcover / custom / window / lighting 为「包干」大类（各只有一条包干项，客户填一个总预算）；
    # soft / appliance 为逐件报价，客户按件填预算。
    furniture-types: |
      [
        {"code":"hardcover","name":"硬装","icon":"🧱","children":[
          {"code":"package","name":"硬装包干","icon":"🧱"}
        ]},
        {"code":"custom","name":"全屋定制","icon":"🚪","children":[
          {"code":"package","name":"定制包干","icon":"🚪"}
        ]},
        {"code":"window","name":"窗户","icon":"🪟","children":[
          {"code":"package","name":"窗户包干","icon":"🪟"}
        ]},
        {"code":"lighting","name":"灯光照明方案","icon":"💡","children":[
          {"code":"package","name":"灯光方案包干","icon":"💡"}
        ]},
        {"code":"soft","name":"软装","icon":"🛋️","children":[
          {"code":"sofa","name":"沙发","icon":"🛋️"},
          {"code":"coffee_table","name":"茶几","icon":"🪑"},
          {"code":"dining_set","name":"餐桌椅","icon":"🍽️"},
          {"code":"bed","name":"床","icon":"🛏️"},
          {"code":"mattress","name":"床垫","icon":"🛌"},
          {"code":"curtain","name":"窗帘","icon":"🧵"},
          {"code":"other_soft","name":"其他软装","icon":"📦"}
        ]},
        {"code":"appliance","name":"家电","icon":"🔌","children":[
          {"code":"air_conditioner","name":"空调","icon":"❄️"},
          {"code":"floor_heating","name":"地暖","icon":"♨️"},
          {"code":"fridge","name":"冰箱","icon":"🧊"},
          {"code":"oven","name":"烤箱","icon":"🍞"},
          {"code":"washer","name":"洗衣机","icon":"🌀"},
          {"code":"dryer","name":"烘干机","icon":"💨"},
          {"code":"drying_rack","name":"晾衣架","icon":"🧺"},
          {"code":"bathroom_heater","name":"浴霸","icon":"🚿"},
          {"code":"tv","name":"电视","icon":"📺"},
          {"code":"dishwasher","name":"洗碗机","icon":"🍽️"},
          {"code":"sterilizer","name":"消毒柜","icon":"🧴"},
          {"code":"hood","name":"油烟机","icon":"🌫️"},
          {"code":"water_purifier","name":"净水器","icon":"🚰"},
          {"code":"gas_stove","name":"燃气灶","icon":"🔥"},
          {"code":"water_heater","name":"热水器","icon":"🛁"},
          {"code":"robot_vacuum","name":"扫地机器人","icon":"🤖"},
          {"code":"other_appliance","name":"其他家电","icon":"📦"}
        ]}
      ]
