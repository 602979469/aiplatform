server:
  port: 8080

spring:
  application:
    name: aiplatform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/aiplatform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 仅本地默认值，生产环境必须通过环境变量注入
    password: ${MYSQL_PASSWORD:123456}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

# AI 模块外部服务配置
ai:
  deepseek:
    # 优先配置文件，其次环境变量 DEEPSEEK_API_KEY
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 1.0
    max-tokens: 4096
    connect-timeout: 30
    read-timeout: 180
  xuanyuan:
    registry-url: https://docker.xuanyuan.run
    web-url: https://xuanyuan.cloud
    username: ${XUANYUAN_USERNAME:}
    password: ${XUANYUAN_PASSWORD:}
    api-timeout-seconds: 30
  chat:
    # 模拟模式：none 正常 / fail 模拟失败 / timeout 模拟超时（测试用）
    simulation: none
    timeout-seconds: 60

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{40} - %msg%n"
  level:
    com.jakt.aiplatform: info
