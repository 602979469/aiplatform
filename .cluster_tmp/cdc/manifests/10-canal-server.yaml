apiVersion: v1
kind: ConfigMap
metadata:
  name: canal-server-conf
  namespace: cdc
data:
  canal.properties: |
    canal.port = 11111
    canal.metrics.pull.port = 11112
    canal.zkServers =
    canal.serverMode = tcp
    canal.destinations = example
    canal.instance.global.mode = spring
    canal.instance.global.lazy = false
    canal.instance.global.spring.xml = classpath:spring/file-instance.xml
    canal.instance.tsdb.enable = true
    canal.instance.tsdb.dir = /home/admin/canal-server/conf/example
  instance.properties.tpl: |
    canal.instance.mysql.slaveId = 1234
    canal.instance.master.address = mysql.tsk.svc.cluster.local:3306
    canal.instance.dbUsername = canal
    canal.instance.dbPassword = __DB_PASSWORD__
    canal.instance.connectionCharset = UTF-8
    # 只同步 aiplatform 库
    canal.instance.filter.regex = aiplatform\..*
    canal.instance.tsdb.enable = true
    canal.instance.tsdb.dir = /home/admin/canal-server/conf/example
    canal.instance.gtidon = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canal-server
  namespace: cdc
  labels:
    app: canal-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: canal-server
  template:
    metadata:
      labels:
        app: canal-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      initContainers:
        # 用镜像自带 conf 打底，再覆盖 canal.properties + 渲染 instance.properties（密码来自 Secret）
        - name: render-conf
          image: docker.io/canal/canal-server:v1.1.8
          command:
            - sh
            - -c
            - cp -a /home/admin/canal-server/conf/. /work/conf/ && cp /cfg/canal.properties /work/conf/canal.properties && sed "s|__DB_PASSWORD__|${DB_PASSWORD}|g" /cfg/instance.properties.tpl > /work/conf/example/instance.properties
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secret
                  key: canal-db-password
          volumeMounts:
            - name: conf
              mountPath: /work/conf
            - name: cfg
              mountPath: /cfg
      containers:
        - name: canal-server
          image: docker.io/canal/canal-server:v1.1.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: canal
              containerPort: 11111
            - name: metrics
              containerPort: 11112
          # 小集群：不写 CPU request（master requests 已满），只按内存调度
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: conf
              mountPath: /home/admin/canal-server/conf
      volumes:
        - name: conf
          emptyDir: {}
        - name: cfg
          configMap:
            name: canal-server-conf
---
apiVersion: v1
kind: Service
metadata:
  name: canal-server
  namespace: cdc
  labels:
    app: canal-server
spec:
  selector:
    app: canal-server
  ports:
    - name: canal
      port: 11111
      targetPort: 11111
